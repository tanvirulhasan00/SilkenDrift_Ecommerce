version: "3.8"

services:
  silkendrift:
    build:
      context: .
      dockerfile: Dockerfile
    image: silkendrift-app:1.0.0
    container_name: silkendrift_storefront
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_APP_NAME=SilkenDrift
      - VITE_APP_URL=http://localhost:3000
      - VITE_DEFAULT_LANGUAGE=bn
      - VITE_FIREBASE_PLAN=spark
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
